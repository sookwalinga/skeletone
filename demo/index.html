<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skeletone demo</title>
    <link rel="stylesheet" href="../skeletone.css" />
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1d2433; }
      body.dark { background: #12151c; color: #e6e8ee; color-scheme: dark; }
      .dark .card { background: #1b2030; border-color: #2a3145; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
      .toolbar button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid #d5dae3; border-radius: 6px; background: #fff; color: inherit; font: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
      .toolbar button:hover { border-color: #8a93a6; }
      .toolbar button:focus-visible { outline: 2px solid #4a5878; outline-offset: 2px; }
      .toolbar .primary { background: #3b4763; border-color: #3b4763; color: #fff; }
      .toolbar .primary:hover { background: #2f3950; border-color: #2f3950; }
      .dark .toolbar button:not(.primary) { background: #1b2030; border-color: #2a3145; }
      .dark .toolbar button:not(.primary):hover { border-color: #5a6684; }
      .dark .toolbar .primary { background: #45537a; border-color: #45537a; }
      .dark .toolbar .primary:hover { background: #505f88; border-color: #505f88; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
      .card { background: #fff; border: 1px solid #e3e6ec; border-radius: 12px; overflow: hidden; }
      .cover { display: block; width: 100%; height: 140px; object-fit: cover; }
      .body { padding: 16px; }
      .row { display: flex; align-items: center; gap: 10px; }
      .avatar { width: 40px; height: 40px; border-radius: 50%; }
      .title { margin: 12px 0 4px; font-size: 1.15rem; }
      .meta { color: #6b7385; font-size: 0.85rem; }
      .tags { display: flex; gap: 6px; margin-top: 12px; }
      .tag { padding: 2px 10px; border-radius: 99px; background: #e8f0ff; color: #2b5cd6; font-size: 0.8rem; }
      .btn { margin-top: 14px; padding: 8px 14px; border: 0; border-radius: 8px; background: #3b4763; color: #fff; }
      .dark .btn { background: #45537a; }
      .detail { max-width: 640px; margin-top: 24px; }
      .detail-head { padding: 12px 16px; border-bottom: 1px solid #e3e6ec; font-size: 0.85rem; }
      .dark .detail-head { border-color: #2a3145; }
      .detail-head a { color: #2b5cd6; }
      .dark .detail-head a { color: #8fb0ff; }
      .detail h2 { margin: 0 0 4px; }
      .detail .tags { flex-wrap: wrap; padding: 0; list-style: none; }
      .apply { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; font-size: 0.85rem; }
      .apply label { display: inline-flex; align-items: center; gap: 6px; }
      /* An inverted section needs its own bar colour. */
      .callout { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; background: #1d2433; color: #fff; font-size: 0.85rem; --skeleton-color: rgb(255 255 255 / 0.2); }
      .dark .callout { background: #e6e8ee; color: #12151c; --skeleton-color: rgb(0 0 0 / 0.13); }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="toggle" class="primary" type="button">Show loaded content</button>
      <button id="theme" type="button">Switch to dark mode</button>
    </div>

    <!-- The same template renders the skeleton (no data) and the loaded card. The status
         message sits outside the inert list, so screen readers announce it. -->
    <span id="status" role="status" class="skeletone-status">Loading opportunities</span>
    <div id="list" class="grid" data-skeleton inert></div>

    <!-- A detail page: while loading it renders a placeholder record, so the lists and
         paragraphs that come from data still exist. The header is not data, so it stays. -->
    <article id="detail" class="card detail" data-skeleton>
      <header class="detail-head" data-skeleton-ignore><a href="#">← All opportunities</a></header>
      <div class="body" inert>
        <h2 data-field="title"></h2>
        <p class="meta"><span data-field="org"></span> · <time data-field="date"></time></p>
        <p data-field="about"></p>
        <ul class="tags" data-field="tags"></ul>
        <p class="callout"><span>Applications close</span> <time data-field="deadline"></time></p>
        <form class="apply">
          <select><option>Choose a track</option><option>Research</option></select>
          <label><input type="checkbox" checked /><span>Email me updates</span></label>
          <progress value="60" max="100"></progress>
        </form>
      </div>
    </article>

    <template id="card">
      <article class="card">
        <img class="cover" alt="" />
        <div class="body">
          <div class="row">
            <img class="avatar" alt="" />
            <div>
              <strong data-field="org"></strong><br />
              <time class="meta" data-field="date"></time>
            </div>
          </div>
          <h3 class="title" data-field="title"></h3>
          <p data-field="summary" data-skeleton-lines></p>
          <div class="tags"><span class="tag" data-field="tag1"></span><span class="tag" data-field="tag2"></span></div>
          <button class="btn">Apply</button>
        </div>
      </article>
    </template>

    <script>
      const DATA = [
        { org: 'Green Futures', date: '12 Nov 2026', title: 'Climate Fellowship', tag1: 'SDG 13', tag2: 'Remote',
          summary: 'A six-month fellowship for young climate leaders, with mentoring, a stipend and a final showcase.' },
        { org: 'Open Classroom', date: '3 Dec 2026', title: 'Teaching Internship', tag1: 'SDG 4', tag2: 'Kampala',
          summary: 'Support teachers in rural schools.' },
        { org: 'Water Works', date: '20 Jan 2027', title: 'Clean Water Scholarship', tag1: 'SDG 6', tag2: 'Global',
          summary: 'Full tuition for engineering students working on water access in their communities.' },
      ]
      const DETAIL = { title: 'Climate Fellowship', org: 'Green Futures', date: '12 Nov 2026',
        about: 'A six-month fellowship for young climate leaders. Fellows get a mentor, a monthly stipend and a budget for a community project, then present their work at a final showcase in Nairobi.',
        tags: ['SDG 13', 'Remote', 'Stipend', 'Mentoring'], deadline: '30 Nov 2026' }
      const PLACEHOLDER = { title: 'xxxxxxxxxxxxxxxxx', org: 'xxxxxxxxxx', date: 'xxxxxxxxxx',
        about: 'x'.repeat(140).replace(/(.{9})/g, '$1 '), tags: ['xxxxx', 'xxxxx', 'xxxxx'], deadline: 'xxxxxxxxxx' }
      const detail = document.getElementById('detail')
      function renderDetail(d) {
        for (const el of detail.querySelectorAll('[data-field]')) {
          const v = d[el.dataset.field]
          if (Array.isArray(v)) el.replaceChildren(...v.map((t) => Object.assign(document.createElement('li'), { className: 'tag', textContent: t })))
          else el.textContent = v
        }
      }
      renderDetail(PLACEHOLDER)

      const list = document.getElementById('list')
      const tpl = document.getElementById('card')

      function render(items) {
        list.replaceChildren(...items.map((item) => {
          const card = tpl.content.cloneNode(true)
          for (const el of card.querySelectorAll('[data-field]')) {
            if (item) { el.textContent = item[el.dataset.field]; el.removeAttribute('data-skeleton-lines') }
          }
          if (item) {
            card.querySelector('.cover').src = 'https://picsum.photos/seed/' + item.tag1.replace(' ', '') + '/600/280'
            card.querySelector('.avatar').src = 'https://picsum.photos/seed/' + item.org.replace(' ', '') + '/80'
          }
          return card
        }))
      }

      let loaded = false
      render([null, null, null])
      document.getElementById('toggle').onclick = () => {
        loaded = !loaded
        render(loaded ? DATA : [null, null, null])
        list.dataset.skeleton = String(!loaded)
        list.inert = !loaded
        document.getElementById('status').hidden = loaded
        renderDetail(loaded ? DETAIL : PLACEHOLDER)
        detail.dataset.skeleton = String(!loaded)
        detail.querySelector('.body').inert = !loaded
        document.getElementById('toggle').textContent = loaded ? 'Show skeleton' : 'Show loaded content'
      }
      // Dark mode follows the system setting first, then the button.
      const theme = document.getElementById('theme')
      function setDark(dark) {
        document.body.classList.toggle('dark', dark)
        theme.textContent = dark ? 'Switch to light mode' : 'Switch to dark mode'
      }
      setDark(matchMedia('(prefers-color-scheme: dark)').matches)
      theme.onclick = () => setDark(!document.body.classList.contains('dark'))
    </script>
  </body>
</html>
