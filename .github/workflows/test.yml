name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these jobs before it publishes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # The image's tag matches @playwright/test, so its browsers and fonts are the ones the
    # stored demo screenshots were made with.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn typecheck
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/

  # Safari's engine as it runs on macOS. WebKit's Linux build draws some controls its own
  # way, so a select's arrow can only be checked here.
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install webkit
      - run: yarn test --project=webkit
