name: release

# Pushing a v* tag tests the tagged commit, then publishes it to npm. Nothing is published
# from a laptop, so a release can't go out with a failing test. npm trusts this workflow
# (the package's Trusted Publisher setting), so no token is stored here.
on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
